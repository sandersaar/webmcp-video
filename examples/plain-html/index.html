<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' https://www.youtube.com https://s.ytimg.com; style-src 'self'; connect-src 'self' ws://127.0.0.1:4173; frame-src https://www.youtube.com https://www.youtube-nocookie.com; img-src 'self'; media-src 'none'; object-src 'none'; base-uri 'none'; form-action 'self'" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WebMCP Video</title>
    <link rel="stylesheet" href="/src/demo/styles.css" />
  </head>
  <body>
    <main>
      <p class="eyebrow">Three simple tools. One exact moment.</p>
      <h1>WebMCP Video</h1>
      <p>Ask a question. The AI finds the moment, explains it, and gets the official player ready there.</p>
      <p id="runtime-status" role="status">Loading WebMCP Video.</p>

      <section class="layout" aria-label="Video and tools">
        <div>
          <iframe
            id="official-player"
            title="Official YouTube player"
            aria-label="Official YouTube player"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            allowfullscreen></iframe>
          <section id="flow-panel" aria-label="Local tool flow"></section>
        </div>
        <aside id="audit-panel" aria-live="polite">
          <h2>Local demo audit</h2>
          <p>This browser session has no tool calls yet.</p>
        </aside>
      </section>
    </main>
    <script type="module" src="/src/demo/main.ts"></script>
  </body>
</html>
